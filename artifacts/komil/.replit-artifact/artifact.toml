kind = "mobile"
previewPath = "/"
title = "Komil | كُميل"
version = "1.0.0"
id = "artifacts/komil"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20132

[services.development]
run = "pnpm --filter @workspace/komil run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/komil", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/komil", "run", "serve" ]

[services.env]
PORT = "20132"
BASE_PATH = "/"
