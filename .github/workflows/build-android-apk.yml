name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/komil/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: EAS Build (Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/komil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile=false

      - name: Initialize EAS project (first run only)
        run: |
          if ! grep -q "projectId" app.json; then
            npx eas-cli init --non-interactive --force || true
          fi

      - name: Build Android APK
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait

      - name: Print build info
        run: |
          echo "::notice::Build started successfully."
          echo "::notice::Track progress at https://expo.dev/accounts/kyan700/projects/komil/builds"
          echo "::notice::APK download link will appear in the build page when complete (typically 10-15 min)."
